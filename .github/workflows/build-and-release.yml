name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore NuGet packages
        run: nuget restore WolfX.sln

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild WolfX.sln /p:Configuration=Release

      - name: Verify build output
        run: |
          if (-not (Test-Path "Binaries\Release")) {
            throw "Binaries\Release was not found - check your build output path."
          }
          $files = Get-ChildItem "Binaries\Release" -Recurse -File
          if ($files.Count -eq 0) {
            throw "Binaries\Release is empty."
          }
          Write-Host "Found $($files.Count) files:"
          $files | ForEach-Object { Write-Host "  $($_.FullName.Substring($PWD.Path.Length + 1))" }

      - name: Stage release contents
        run: |
          $stage = "staging\YuGiOhEX"
          New-Item -ItemType Directory -Force -Path "$stage\Redist" | Out-Null
          Copy-Item "Binaries\Release\*" -Destination $stage -Recurse

          # .NET 8 Desktop Runtime (latest 8.0.x)
          Invoke-WebRequest -Uri "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" `
            -OutFile "$stage\Redist\windowsdesktop-runtime-8.0-win-x64.exe"

          # Visual C++ Redistributable (2015-2022)
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "$stage\Redist\vc_redist.x64.exe"

          # Optional x86 versions, uncomment if you ship 32-bit binaries
          # Invoke-WebRequest -Uri "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x86.exe" `
          #   -OutFile "$stage\Redist\windowsdesktop-runtime-8.0-win-x86.exe"
          # Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" `
          #   -OutFile "$stage\Redist\vc_redist.x86.exe"

      - name: Zip release
        run: Compress-Archive -Path "staging\YuGiOhEX\*" -DestinationPath YuGiOhEX.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            Release ${{ github.ref_name }}
            Built from commit ${{ github.sha }}

            If the game fails to start, install the runtimes in the `Redist` folder first.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            YuGiOhEX.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
