; Settings this mod needs. Yu-Gi-Oh-Core uses them instead of the ones in your own Config.ini while the mod is switched on,
; so you don't have to edit yours (docs/Mods.md "Settings"). Change them here, or in WolfX: File > Edit a mod > Tools > Config Editor.

; Lays the card face out like Forbidden Memories' cards (needs the Anime Cards plugin).
[Yu-Gi-Oh-AnimeCards]
CardArtScale=1.05
CardArtOffsetX=18.5
CardArtOffsetY=38
CustomAtkX=302
CustomAtkY=498
CustomDefX=302
CustomDefY=532
AtkTextScale=1.8
DefTextScale=1.8
AtkLabel="ATK "
DefLabel="DEF "
AttributeX=353
AttributeY=64
AttributeSize=44
SpellTrapAttribute=1
StarsAlign=1
StarsX=372
StarsY=116
StarsMaxWidth=170
ShowName=1
NameX=52
NameY=68
NameWidth=280
HideSpellTrapIcon=1

; Forbidden Memories' duel rules (the Yu-Gi-Oh-FM plugin).
[Yu-Gi-Oh-FM]
NoTributes=1
FusionsInMainDeck=1
