; Settings this mod needs. Yu-Gi-Oh-Core uses them instead of the ones in your own Config.ini while the mod is switched on,
; so you don't have to edit yours (docs/Mods.md "Settings"). Change them here, or in WolfX: File > Edit a mod > Tools > Config Editor.

; Moves the ATK/DEF text and the art to where these frames have room for them (needs the Anime Cards plugin).
[Yu-Gi-Oh-AnimeCards]
; ATK / DEF: the centres of the frame's two boxes (32-185 and 216-369 wide, 495-558 tall); the text is centred on them
CustomAtkX=108.5
CustomAtkY=526.5
CustomDefX=292.5
CustomDefY=526.5
; the numbers use the large font; this mod's fontbin\FONT_ID_CARD_ATKDEF_SCALE.png is 8x, so they stay sharp scaled up
LargeFontScale=1.7
; (only used if the large font is off)
AtkTextScale=3.1
DefTextScale=3.1
; the art fills the frame's picture window (about 10-391 x 10-426): 304 x 1.38 = 420 px, centred on y 218 (258 - 40)
CardArtScale=1.38
CardArtOffsetX=0.0
CardArtOffsetY=-40.0
