; Settings this mod needs. Yu-Gi-Oh-Core uses them instead of the ones in your own Config.ini while the mod is switched on,
; so you don't have to edit yours (docs/Mods.md "Settings"). Change them here, or in WolfX: File > Edit a mod > Tools > Config Editor.

; Moves the ATK/DEF text and the art to where these frames have room for them (needs the Anime Cards plugin).
[Yu-Gi-Oh-AnimeCards]
CustomAtkX=135.0
CustomAtkY=507.0
CustomDefX=250.0
CustomDefY=500.0
AtkTextScale=2.5
DefTextScale=2.5
CardArtScale=1.3
CardArtOffsetX=0.0
CardArtOffsetY=-50.0
